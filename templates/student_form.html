{% extends 'base.html' %}

{% block title %}{{ action }} Student | University Athletics{% endblock %}

{% block content %}
<header class="page-header"><div class="eyebrow">Student directory</div><h1>{{ action }} Student</h1><p class="page-description">Enter the student profile and academic details below.</p></header>
<section class="form-panel" aria-label="Student details">
    <form method="POST">
        <div class="row g-3">
            <div class="col-12"><label for="StudentID" class="form-label">Student ID</label><input id="StudentID" type="text" name="StudentID" class="form-control" value="{{ student.StudentID if student else '' }}" maxlength="20" required {% if student %}readonly{% endif %}></div>
            <div class="col-md-6"><label for="FirstName" class="form-label">First Name</label><input id="FirstName" type="text" name="FirstName" class="form-control" value="{{ student.FirstName if student else '' }}" maxlength="50" required></div>
            <div class="col-md-6"><label for="LastName" class="form-label">Last Name</label><input id="LastName" type="text" name="LastName" class="form-control" value="{{ student.LastName if student else '' }}" maxlength="50" required></div>
            <div class="col-md-6"><label for="DOB" class="form-label">Date of Birth</label><input id="DOB" type="date" name="DOB" class="form-control" value="{{ student.DOB.isoformat() if student and student.DOB else '' }}" required></div>
            <div class="col-md-6"><label for="Email" class="form-label">Email</label><input id="Email" type="email" name="Email" class="form-control" value="{{ student.Email if student else '' }}" maxlength="100" required></div>
            <div class="col-md-6"><label for="Department" class="form-label">Department</label><input id="Department" type="text" name="Department" class="form-control" value="{{ student.Department or '' if student else '' }}" maxlength="100"></div>
            <div class="col-md-6"><label for="StudyYear" class="form-label">Study Year</label><select id="StudyYear" name="StudyYear" class="form-select"><option value="">Not specified</option>{% for year in range(1, 7) %}<option value="{{ year }}" {% if student and student.StudyYear == year %}selected{% endif %}>Year {{ year }}</option>{% endfor %}</select></div>
        </div>
        <div class="form-actions"><button type="submit" class="btn btn-success">{{ 'Update' if action == 'Edit' else 'Save' }} Student</button><a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a></div>
    </form>
</section>
{% endblock %}
