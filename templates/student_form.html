
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 700px;">
    <h2 class="mb-4">{{ action }} Student</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input type="text" name="StudentID" class="form-control"
                   value="{{ student.StudentID if student else '' }}"
                   maxlength="20" required
                   {% if student %}readonly{% endif %}>
        </div>

        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" name="FirstName" class="form-control"
                   value="{{ student.FirstName if student else '' }}"
                   maxlength="50" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" name="LastName" class="form-control"
                   value="{{ student.LastName if student else '' }}"
                   maxlength="50" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" name="DOB" class="form-control"
                   value="{{ student.DOB.isoformat() if student and student.DOB else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="Email" class="form-control"
                   value="{{ student.Email if student else '' }}"
                   maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="Department" class="form-control"
                   value="{{ student.Department or '' if student else '' }}"
                   maxlength="100">
        </div>

        <div class="mb-3">
            <label class="form-label">Study Year</label>
            <select name="StudyYear" class="form-select">
                <option value="">Not specified</option>
                {% for year in range(1, 7) %}
                    <option value="{{ year }}"
                        {% if student and student.StudyYear == year %}selected{% endif %}>
                        Year {{ year }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Save Student
        </button>

        <a href="{{ url_for('students') }}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

</body>
</html>
