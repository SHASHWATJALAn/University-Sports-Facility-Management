
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Equipment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 650px;">

    <h2 class="mb-4">{{ action }} Equipment</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Equipment ID</label>
            <input type="text" name="EquipmentID" class="form-control"
                   value="{{ item.EquipmentID if item else '' }}"
                   maxlength="20" required
                   {% if item and action == 'Edit' %}readonly{% endif %}>
        </div>

        <div class="mb-3">
            <label class="form-label">Equipment Name</label>
            <input type="text" name="EquipmentName" class="form-control"
                   value="{{ item.EquipmentName if item else '' }}"
                   maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity Available</label>
            <input type="number" name="QuantityAvailable" class="form-control"
                   value="{{ item.QuantityAvailable if item else '' }}"
                   min="0" max="4294967295" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Purchase Date (Optional)</label>
            <input type="date" name="PurchaseDate" class="form-control"
                   value="{{ item.PurchaseDate.isoformat() if item and item.PurchaseDate else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Sport</label>
            <select name="SportID" class="form-select" required>
                <option value="">Select a sport</option>

                {% for sport in sports %}
                    <option value="{{ sport.SportID }}"
                        {% if item and item.SportID == sport.SportID %}selected{% endif %}>
                        {{ sport.SportName }} ({{ sport.SportID }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save Equipment</button>
        <a href="{{ url_for('equipment') }}" class="btn btn-secondary">Cancel</a>

    </form>

</div>
</body>
</html>
