{% extends 'base.html' %}

{% block title %}{{ action }} Equipment | University Athletics{% endblock %}

{% block content %}
<header class="page-header"><div class="eyebrow">Inventory</div><h1>{{ action }} Equipment</h1><p class="page-description">Record equipment inventory details and associate it with a sport.</p></header>
<section class="form-panel" aria-label="Equipment details">
    <form method="POST">
        <div class="row g-3">
            <div class="col-12"><label for="EquipmentID" class="form-label">Equipment ID</label><input id="EquipmentID" type="text" name="EquipmentID" class="form-control" value="{{ item.EquipmentID if item else '' }}" maxlength="20" required {% if item and action == 'Edit' %}readonly{% endif %}></div>
            <div class="col-md-6"><label for="EquipmentName" class="form-label">Equipment Name</label><input id="EquipmentName" type="text" name="EquipmentName" class="form-control" value="{{ item.EquipmentName if item else '' }}" maxlength="100" required></div>
            <div class="col-md-6"><label for="QuantityAvailable" class="form-label">Quantity Available</label><input id="QuantityAvailable" type="number" name="QuantityAvailable" class="form-control" value="{{ item.QuantityAvailable if item else '' }}" min="0" max="4294967295" required></div>
            <div class="col-md-6"><label for="PurchaseDate" class="form-label">Purchase Date (Optional)</label><input id="PurchaseDate" type="date" name="PurchaseDate" class="form-control" value="{{ item.PurchaseDate.isoformat() if item and item.PurchaseDate else '' }}"></div>
            <div class="col-md-6"><label for="SportID" class="form-label">Sport</label><select id="SportID" name="SportID" class="form-select" required><option value="">Select a sport</option>{% for sport in sports %}<option value="{{ sport.SportID }}" {% if item and item.SportID == sport.SportID %}selected{% endif %}>{{ sport.SportName }} ({{ sport.SportID }})</option>{% endfor %}</select></div>
        </div>
        <div class="form-actions"><button type="submit" class="btn btn-success">{{ 'Update' if action == 'Edit' else 'Save' }} Equipment</button><a href="{{ url_for('equipment') }}" class="btn btn-outline-secondary">Cancel</a></div>
    </form>
</section>
{% endblock %}
