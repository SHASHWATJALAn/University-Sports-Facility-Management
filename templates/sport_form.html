
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">

    <h2 class="mb-4">{{ action }} Sport</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Sport ID</label>
            <input type="text" name="SportID" class="form-control"
                   value="{{ sport.SportID if sport else '' }}"
                   maxlength="20" required
                   {% if sport %}readonly{% endif %}>
        </div>

        <div class="mb-3">
            <label class="form-label">Sport Name</label>
            <input type="text" name="SportName" class="form-control"
                   value="{{ sport.SportName if sport else '' }}"
                   maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="Category" class="form-control"
                   value="{{ sport.Category if sport else '' }}"
                   maxlength="50" required>
        </div>

        <button type="submit" class="btn btn-success">
            Save Sport
        </button>

        <a href="{{ url_for('sports') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
</body>
</html>
