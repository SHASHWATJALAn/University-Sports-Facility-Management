{% extends 'base.html' %}

{% block title %}{{ action }} Sport | University Athletics{% endblock %}

{% block content %}
<header class="page-header"><div class="eyebrow">Sports programs</div><h1>{{ action }} Sport</h1><p class="page-description">Provide the sport identifier and classification details.</p></header>
<section class="form-panel" aria-label="Sport details">
    <form method="POST">
        <div class="row g-3">
            <div class="col-12"><label for="SportID" class="form-label">Sport ID</label><input id="SportID" type="text" name="SportID" class="form-control" value="{{ sport.SportID if sport else '' }}" maxlength="20" required {% if sport %}readonly{% endif %}></div>
            <div class="col-md-6"><label for="SportName" class="form-label">Sport Name</label><input id="SportName" type="text" name="SportName" class="form-control" value="{{ sport.SportName if sport else '' }}" maxlength="100" required></div>
            <div class="col-md-6"><label for="Category" class="form-label">Category</label><input id="Category" type="text" name="Category" class="form-control" value="{{ sport.Category if sport else '' }}" maxlength="50" required></div>
        </div>
        <div class="form-actions"><button type="submit" class="btn btn-success">{{ 'Update' if action == 'Edit' else 'Save' }} Sport</button><a href="{{ url_for('sports') }}" class="btn btn-outline-secondary">Cancel</a></div>
    </form>
</section>
{% endblock %}
