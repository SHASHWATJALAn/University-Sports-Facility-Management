
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 750px;">

    <h2 class="mb-4">{{ action }} Payment</h2>

    

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label for="PaymentID" class="form-label">Payment ID</label>

            <input type="text"
                   id="PaymentID"
                   name="PaymentID"
                   class="form-control"
                   maxlength="20"
                   value="{{ payment.PaymentID if payment else request.form.get('PaymentID', '') }}"
                   {% if action == 'Edit' %}readonly{% endif %}
                   required>
        </div>

        <div class="mb-3">
            <label for="Amount" class="form-label">Amount</label>

            <input type="number"
                   id="Amount"
                   name="Amount"
                   class="form-control"
                   min="0.01"
                   step="0.01"
                   value="{{ payment.Amount if payment else request.form.get('Amount', '') }}"
                   required>
        </div>

        <div class="mb-3">
            <label for="PaymentDate" class="form-label">Payment Date</label>

            <input type="date"
                   id="PaymentDate"
                   name="PaymentDate"
                   class="form-control"
                   value="{{ payment.PaymentDate if payment and payment.PaymentDate else request.form.get('PaymentDate', '') }}"
                   required>
        </div>

        <div class="mb-3">
            <label for="PaymentMode" class="form-label">Payment Mode</label>

            <select id="PaymentMode"
                    name="PaymentMode"
                    class="form-select"
                    required>

                <option value="">Select payment mode</option>

                {% for mode in ['Cash', 'UPI', 'Card', 'Net Banking', 'Other'] %}
                    <option value="{{ mode }}"
                        {% if (payment and payment.PaymentMode == mode) or request.form.get('PaymentMode') == mode %}selected{% endif %}>
                        {{ mode }}
                    </option>
                {% endfor %}

                {% if payment and payment.PaymentMode and payment.PaymentMode not in ['Cash', 'UPI', 'Card', 'Net Banking', 'Other'] %}
                    <option value="{{ payment.PaymentMode }}" selected>
                        {{ payment.PaymentMode }}
                    </option>
                {% endif %}

            </select>
        </div>

        <div class="mb-3">
            <label for="BookingID" class="form-label">Booking</label>

            <select id="BookingID"
                    name="BookingID"
                    class="form-select"
                    required>

                <option value="">Select booking</option>

                {% for booking in bookings %}
                    <option value="{{ booking.BookingID }}"
                        {% if (payment and payment.BookingID == booking.BookingID) or request.form.get('BookingID') == booking.BookingID %}selected{% endif %}>
                        {{ booking.BookingID }}
                        — {{ booking.StudentName }}
                        — {{ booking.VenueName }}
                        ({{ booking.BookingDate }}
                        {{ booking.StartTime }}–{{ booking.EndTime }}
                        — {{ booking.Status }})
                    </option>
                {% endfor %}

            </select>

            <div class="form-text">
                Only bookings without another payment are available, except the
                booking already assigned to this payment when editing.
            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Save Payment
        </button>

        <a href="{{ url_for('payments') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
