
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Certification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 650px;">

    <h2 class="mb-4">{{ action }} Certification</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        {% if action == "Add" %}
        <div class="mb-3">
            <label class="form-label">Coach</label>
            <select name="CoachID" class="form-select" required>
                <option value="">Select a coach</option>
                {% for coach in coaches %}
                    <option value="{{ coach.CoachID }}"
                        {% if certification and certification.CoachID == coach.CoachID %}selected{% endif %}>
                        {{ coach.CoachName }} ({{ coach.CoachID }})
                    </option>
                {% endfor %}
            </select>
        </div>
        {% else %}
        <div class="mb-3">
            <label class="form-label">Coach ID</label>
            <input type="text" class="form-control"
                   value="{{ certification.CoachID }}" readonly>
        </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Certification</label>
            <input type="text" name="Certification" class="form-control"
                   value="{{ certification.Certification if certification else '' }}"
                   maxlength="150" required>
        </div>

        <button type="submit" class="btn btn-success">Save Certification</button>
        <a href="{{ url_for('certifications') }}" class="btn btn-secondary">Cancel</a>

    </form>

</div>
</body>
</html>
