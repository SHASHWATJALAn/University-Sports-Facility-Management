
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Coach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 650px;">

    <h2 class="mb-4">{{ action }} Coach</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Coach ID</label>
            <input type="text" name="CoachID" class="form-control"
                   value="{{ coach.CoachID if coach else '' }}"
                   maxlength="20" required
                   {% if coach and action == 'Edit' %}readonly{% endif %}>
        </div>

        <div class="mb-3">
            <label class="form-label">Coach Name</label>
            <input type="text" name="CoachName" class="form-control"
                   value="{{ coach.CoachName if coach else '' }}"
                   maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Experience (Years)</label>
            <input type="number" name="ExperienceYears" class="form-control"
                   value="{{ coach.ExperienceYears if coach else '' }}"
                   min="0" max="65535" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone (Optional)</label>
            <input type="tel" name="Phone" class="form-control"
                   value="{{ coach.Phone if coach else '' }}"
                   maxlength="20">
        </div>

        <div class="mb-3">
            <label class="form-label">Sport</label>
            <select name="SportID" class="form-select" required>
                <option value="">Select a sport</option>

                {% for sport in sports %}
                    <option value="{{ sport.SportID }}"
                        {% if coach and coach.SportID == sport.SportID %}selected{% endif %}>
                        {{ sport.SportName }} ({{ sport.SportID }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save Coach</button>
        <a href="{{ url_for('coaches') }}" class="btn btn-secondary">Cancel</a>

    </form>

</div>
</body>
</html>
