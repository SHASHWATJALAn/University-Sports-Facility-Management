{% extends 'base.html' %}

{% block title %}{{ action }} Coach | University Athletics{% endblock %}

{% block content %}
<header class="page-header"><div class="eyebrow">Staff directory</div><h1>{{ action }} Coach</h1><p class="page-description">Add coach contact information, experience, and sport assignment.</p></header>
<section class="form-panel" aria-label="Coach details">
    <form method="POST">
        <div class="row g-3">
            <div class="col-12"><label for="CoachID" class="form-label">Coach ID</label><input id="CoachID" type="text" name="CoachID" class="form-control" value="{{ coach.CoachID if coach else '' }}" maxlength="20" required {% if coach and action == 'Edit' %}readonly{% endif %}></div>
            <div class="col-md-6"><label for="CoachName" class="form-label">Coach Name</label><input id="CoachName" type="text" name="CoachName" class="form-control" value="{{ coach.CoachName if coach else '' }}" maxlength="100" required></div>
            <div class="col-md-6"><label for="ExperienceYears" class="form-label">Experience (Years)</label><input id="ExperienceYears" type="number" name="ExperienceYears" class="form-control" value="{{ coach.ExperienceYears if coach else '' }}" min="0" max="65535" required></div>
            <div class="col-md-6"><label for="Phone" class="form-label">Phone (Optional)</label><input id="Phone" type="tel" name="Phone" class="form-control" value="{{ coach.Phone if coach else '' }}" maxlength="20"></div>
            <div class="col-md-6"><label for="SportID" class="form-label">Sport</label><select id="SportID" name="SportID" class="form-select" required><option value="">Select a sport</option>{% for sport in sports %}<option value="{{ sport.SportID }}" {% if coach and coach.SportID == sport.SportID %}selected{% endif %}>{{ sport.SportName }} ({{ sport.SportID }})</option>{% endfor %}</select></div>
        </div>
        <div class="form-actions"><button type="submit" class="btn btn-success">{{ 'Update' if action == 'Edit' else 'Save' }} Coach</button><a href="{{ url_for('coaches') }}" class="btn btn-outline-secondary">Cancel</a></div>
    </form>
</section>
{% endblock %}
