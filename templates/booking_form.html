
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ action }} Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 750px;">

    <h2 class="mb-4">{{ action }} Booking</h2>

    {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Booking ID</label>
            <input type="text" name="BookingID" class="form-control"
                   value="{{ booking.BookingID if booking else '' }}"
                   maxlength="20" required
                   {% if booking and action == 'Edit' %}readonly{% endif %}>
        </div>

        <div class="mb-3">
            <label class="form-label">Booking Date</label>
            <input type="date" name="BookingDate" class="form-control"
                 value="{{ booking.BookingDate if booking and booking.BookingDate else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Time</label>
            <input type="time" name="StartTime" class="form-control"
                   value="{{ booking.StartTime|string if booking else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">End Time</label>
            <input type="time" name="EndTime" class="form-control"
                   value="{{ booking.EndTime|string if booking else '' }}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Student</label>
            <select name="StudentID" class="form-select" required>
                <option value="">Select a student</option>
                {% for student in students %}
                    <option value="{{ student.StudentID }}"
                        {% if booking and booking.StudentID == student.StudentID %}selected{% endif %}>
                        {{ student.FirstName }} {{ student.LastName }}
                        ({{ student.StudentID }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Sport</label>
            <select name="SportID" id="sportSelect" class="form-select" required>
                <option value="">Select a sport</option>
                {% for sport in sports %}
                    <option value="{{ sport.SportID }}"
                        {% if booking and booking.SportID == sport.SportID %}selected{% endif %}>
                        {{ sport.SportName }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Venue</label>
            <select name="VenueID" id="venueSelect" class="form-select" required>
                <option value="">Select a venue</option>
                {% for venue in venues %}
                    <option value="{{ venue.VenueID }}"
                            data-sport="{{ venue.SportID }}"
                        {% if booking and booking.VenueID == venue.VenueID %}selected{% endif %}>
                        {{ venue.VenueName }} ({{ venue.VenueID }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="Status" class="form-select" required>
                {% for status in statuses %}
                    <option value="{{ status }}"
                        {% if booking and booking.Status == status %}selected
                        {% elif not booking and status == 'Pending' %}selected{% endif %}>
                        {{ status }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save Booking</button>
        <a href="{{ url_for('bookings') }}" class="btn btn-secondary">Cancel</a>

    </form>
</div>

<script>
    const sportSelect = document.getElementById("sportSelect");
    const venueSelect = document.getElementById("venueSelect");

    function filterVenues() {
        const selectedSport = sportSelect.value;

        for (const option of venueSelect.options) {
            if (!option.value) {
                option.hidden = false;
                continue;
            }

            option.hidden = option.dataset.sport !== selectedSport;
        }

        if (
            venueSelect.selectedOptions.length &&
            venueSelect.selectedOptions[0].hidden
        ) {
            venueSelect.value = "";
        }
    }

    sportSelect.addEventListener("change", filterVenues);
    filterVenues();
</script>

</body>
</html>
